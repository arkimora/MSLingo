name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: TWA Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare Gradle wrapper
        working-directory: twa
        run: |
          chmod +x gradlew
          # Download gradle-wrapper.jar since it's gitignored to keep the repo small
          WRAPPER_VERSION=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9.]*\)-.*/\1/')
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v${WRAPPER_VERSION}/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
      - name: Build debug APK
        working-directory: twa
        run: |
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mslingo-debug.apk
          path: twa/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
