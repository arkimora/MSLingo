apply plugin: 'com.android.application'

def appUrl = 'https://mslingo.app'
def appName = 'MSLingo'

android {
  namespace 'app.mslingo.twa'
  compileSdkVersion 35

  defaultConfig {
    applicationId 'app.mslingo.twa'
    minSdkVersion 22
    targetSdkVersion 35
    versionCode 1
    versionName '0.1.0'
  }

  signingConfigs {
    release {
      // Loaded from keystore.properties (gitignored) — see SIGNING.md
      def keystorePropertiesFile = rootProject.file("app/keystore/keystore.properties")
      if (keystorePropertiesFile.exists()) {
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        storeFile file(keystoreProperties['storeFile'])
        storePassword keystoreProperties['storePassword']
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
      } else if (System.getenv('KEYSTORE_PATH')) {
        // Fallback: load from environment (used in some CI setups)
        storeFile file(System.getenv('KEYSTORE_PATH'))
        storePassword System.getenv('KEYSTORE_PASSWORD')
        keyAlias System.getenv('KEY_ALIAS')
        keyPassword System.getenv('KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    debug {
      // Debug APKs are signed automatically by the Android Gradle Plugin
      // with a debug keystore.
    }
    release {
      signingConfig signingConfigs.release
      minifyEnabled true
      shrinkResources true
    }
  }
}

dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
  implementation 'androidx.appcompat:appcompat:1.6.1'
}
